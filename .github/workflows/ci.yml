---
name: CI

'on':
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}
  SFETCH_GITHUB_TOKEN: ${{ github.token }}
  # Keep in sync with Makefile SFETCH_ACTION_SHA / SFETCH_VERSION (assert-sfetch-pin-coupling).
  SFETCH_ACTION_SHA: c44577261902c848119d3c89b0138becb613b158
  SFETCH_VERSION: v0.4.15
  GONEAT_VERSION: v0.6.6

jobs:
  test:
    name: Linux quality (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.26.10'

      - name: Assert native host
        run: |
          set -euo pipefail
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "linux/amd64"

      # No minisign here — verified bootstrap must not see ambient verifier.
      - name: Install system tools
        run: |
          sudo apt-get update && \
            sudo apt-get install -y --no-install-recommends \
            yamllint shellcheck ripgrep

      - name: Preflight no ambient sfetch/goneat/minisign
        run: |
          set -euo pipefail
          for t in sfetch goneat minisign; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "error: ambient $t present before verified bootstrap: $(command -v "$t")" >&2
              exit 1
            fi
          done
          echo "[ok] clean-runner preflight: no ambient sfetch/goneat/minisign"

      - name: Setup sfetch (verified action)
        uses: 3leaps/sfetch/.github/actions/setup-sfetch@c44577261902c848119d3c89b0138becb613b158  # v0.4.15
        with:
          sfetch-version: v0.4.15
          install-dir: ${{ github.workspace }}/bin

      - name: Install goneat via sfetch (pinned)
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          sfetch --repo fulmenhq/goneat \
            --tag "${GONEAT_VERSION}" \
            --dest-dir bin \
            --require-minisign

      - name: Exact tool pin assertions
        run: |
          export PATH="$PWD/bin:$PATH"
          make assert-tool-pins

      - name: Assert pin coupling + no pipe-to-bash
        run: |
          make assert-sfetch-pin-coupling
          make assert-no-pipe-install-sfetch

      # Harness-only verifier: after bootstrap + pin asserts, never before.
      - name: Acquire minisign for negative harness only
        run: |
          set -euo pipefail
          ./scripts/acquire-minisign-for-harness.sh "$PWD/bin"
          export PATH="$PWD/bin:$PATH"
          command -v minisign
          minisign -v 2>&1 | head -n1

      - name: Consumer bootstrap negative controls
        run: |
          export PATH="$PWD/bin:$PATH"
          make test-bootstrap-negative-controls

      - name: sfetch pin freshness (informational soft-warn only)
        run: make check-sfetch-pin-freshness
        continue-on-error: true

      - name: Install pinned gosec
        run: |
          make gosec-install
          export PATH="$PWD/bin:$PATH"
          [ "$(command -v gosec)" = "$PWD/bin/gosec" ]

      - name: Install pinned Decernor
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/decernor-ci"
          mkdir -p "$tool_dir"
          SHELLSENTRY_DECERNOR_BIN="$(./scripts/ci-install-decernor.sh "$tool_dir")"
          case "$SHELLSENTRY_DECERNOR_BIN" in
            *$'\n'*) echo "error: Decernor install printed extra stdout" >&2; exit 1 ;;
          esac
          echo "SHELLSENTRY_DECERNOR_BIN=$SHELLSENTRY_DECERNOR_BIN" >>"$GITHUB_ENV"
          echo "Installed Decernor at $SHELLSENTRY_DECERNOR_BIN"

      - name: Verify committed public anchors
        run: |
          set -euo pipefail
          test -x "${SHELLSENTRY_DECERNOR_BIN:?SHELLSENTRY_DECERNOR_BIN required}"
          ./scripts/release-verify-committed-anchors.sh
          ./scripts/ci-install-decernor.test.sh
          ./scripts/release-verify-committed-anchors.test.sh

      - name: Quality
        run: |
          export PATH="$PWD/bin:$PATH"
          make prepush

      - name: Dogfood install-sfetch.sh with shellsentry
        run: |
          export PATH="$PWD/bin:$PATH"
          make dogfood

  test-linux-arm64:
    name: Linux quality (arm64)
    runs-on: ubuntu-latest-arm64-s
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.26.10'

      - name: Assert native host
        run: |
          set -euo pipefail
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "linux/arm64"

      - name: Install system tools
        run: |
          sudo apt-get update && \
            sudo apt-get install -y --no-install-recommends \
            yamllint shellcheck ripgrep

      - name: Preflight no ambient sfetch/goneat/minisign
        run: |
          set -euo pipefail
          for t in sfetch goneat minisign; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "error: ambient $t present before verified bootstrap: $(command -v "$t")" >&2
              exit 1
            fi
          done

      - name: Setup sfetch (verified action)
        uses: 3leaps/sfetch/.github/actions/setup-sfetch@c44577261902c848119d3c89b0138becb613b158  # v0.4.15
        with:
          sfetch-version: v0.4.15
          install-dir: ${{ github.workspace }}/bin

      - name: Install goneat via sfetch (pinned)
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          sfetch --repo fulmenhq/goneat \
            --tag "${GONEAT_VERSION}" \
            --dest-dir bin \
            --require-minisign

      - name: Exact tool pin assertions
        run: |
          export PATH="$PWD/bin:$PATH"
          make assert-tool-pins

      - name: Test and build
        run: |
          export PATH="$PWD/bin:$PATH"
          make test build

  macos-bootstrap-smoke:
    name: macOS bootstrap smoke (Makefile path)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.26.10'

      - name: Assert native host
        run: |
          set -euo pipefail
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "darwin/arm64"

      - name: Preflight no ambient sfetch/goneat when possible
        run: |
          set -euo pipefail
          # macOS images may ship nothing; if present, note (Makefile path still digest-pins engine)
          for t in sfetch goneat; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "note: ambient $t at $(command -v "$t") (Makefile bootstrap still uses digest-pinned engine)"
            fi
          done

      - name: Verified make bootstrap (engine digest path)
        run: |
          set -euo pipefail
          make bootstrap
          export PATH="$PWD/bin:$PATH"
          make assert-tool-pins

      - name: Acquire minisign for negative harness only
        run: |
          set -euo pipefail
          if ! command -v minisign >/dev/null 2>&1; then
            ./scripts/acquire-minisign-for-harness.sh "$PWD/bin"
          fi
          export PATH="$PWD/bin:$PATH"
          make test-bootstrap-negative-controls

      - name: Signed-tag tooling tests
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          if ! command -v gpg >/dev/null 2>&1; then
            brew install gnupg
          fi
          if ! command -v jq >/dev/null 2>&1; then
            brew install jq
          fi
          GOTOOLCHAIN=go1.26.10 make release-tag-tests

  windows-dogfood-x64:
    name: Windows dogfood (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.26.10'

      - name: Assert native host
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "windows/amd64"

      - name: Preflight no ambient sfetch/goneat/minisign
        shell: bash
        run: |
          set -euo pipefail
          for t in sfetch goneat minisign; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "error: ambient $t present before verified bootstrap: $(command -v "$t")" >&2
              exit 1
            fi
          done

      - name: Setup sfetch (verified action)
        uses: 3leaps/sfetch/.github/actions/setup-sfetch@c44577261902c848119d3c89b0138becb613b158  # v0.4.15
        with:
          sfetch-version: v0.4.15
          install-dir: ${{ github.workspace }}/bin

      - name: Install goneat via sfetch
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          SFETCH_BIN=sfetch
          if [ -x ./bin/sfetch.exe ]; then SFETCH_BIN=./bin/sfetch.exe; fi
          if [ -x ./bin/sfetch ]; then SFETCH_BIN=./bin/sfetch; fi
          "$SFETCH_BIN" --repo fulmenhq/goneat \
            --tag "${GONEAT_VERSION}" \
            --dest-dir bin \
            --require-minisign

      - name: Exact tool pin assertions
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          make assert-tool-pins

      - name: Acquire minisign for negative harness only
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/acquire-minisign-for-harness.sh "$PWD/bin"
          export PATH="$PWD/bin:$PATH"
          make test-bootstrap-negative-controls

      - name: Test and build
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          go test ./...
          make build

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Package Windows zip
        shell: bash
        run: |
          set -euo pipefail
          py="$(command -v python)"
          case "$py" in
            *WindowsApps*) echo "error: Windows Store python stub at $py" >&2; exit 1 ;;
          esac
          test -s "$py"
          ASSET="shellsentry_$(go env GOOS)_$(go env GOARCH)"
          ARCHIVE="${ASSET}.zip"
          test -s "bin/${ASSET}.exe"
          (cd bin && mv "${ASSET}.exe" "shellsentry.exe")
          "$py" -c 'import zipfile,sys; z=zipfile.ZipFile(sys.argv[1],"w",zipfile.ZIP_DEFLATED); z.write("bin/shellsentry.exe","shellsentry.exe")' "${ARCHIVE}"
          (cd bin && mv "shellsentry.exe" "${ASSET}.exe")
          test -s "${ARCHIVE}"
          echo "packed ${ARCHIVE}"

  windows-dogfood-arm64:
    name: Windows dogfood (arm64)
    runs-on: windows-latest-arm64-s
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.26.10'

      - name: Assert native host
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "windows/arm64"

      - name: Preflight no ambient sfetch/goneat/minisign
        shell: bash
        run: |
          set -euo pipefail
          for t in sfetch goneat minisign; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "error: ambient $t present before verified bootstrap: $(command -v "$t")" >&2
              exit 1
            fi
          done

      - name: Setup sfetch (verified action)
        uses: 3leaps/sfetch/.github/actions/setup-sfetch@c44577261902c848119d3c89b0138becb613b158  # v0.4.15
        with:
          sfetch-version: v0.4.15
          install-dir: ${{ github.workspace }}/bin

      - name: Verify install script detects windows arm64
        shell: bash
        run: |
          set -euo pipefail
          lib="$(mktemp)"
          sed '$d' scripts/install-shellsentry.sh > "$lib"
          printf '\ndetect_platform\n' >> "$lib"
          platform="$(bash "$lib" | tr -d '\r\n')"
          echo "Detected platform via install-shellsentry.sh: $platform"
          test "$platform" = "windows_arm64"

      - name: Install goneat via sfetch
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          SFETCH_BIN=sfetch
          if [ -x ./bin/sfetch.exe ]; then SFETCH_BIN=./bin/sfetch.exe; fi
          if [ -x ./bin/sfetch ]; then SFETCH_BIN=./bin/sfetch; fi
          "$SFETCH_BIN" --repo fulmenhq/goneat \
            --tag "${GONEAT_VERSION}" \
            --dest-dir bin \
            --require-minisign

      - name: Exact tool pin assertions
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          make assert-tool-pins

      - name: Acquire minisign for negative harness only
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/acquire-minisign-for-harness.sh "$PWD/bin"
          export PATH="$PWD/bin:$PATH"
          make test-bootstrap-negative-controls

      - name: Test and build
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          go test ./...
          make build

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Package Windows zip
        shell: bash
        run: |
          set -euo pipefail
          py="$(command -v python)"
          case "$py" in
            *WindowsApps*) echo "error: Windows Store python stub at $py" >&2; exit 1 ;;
          esac
          test -s "$py"
          ASSET="shellsentry_$(go env GOOS)_$(go env GOARCH)"
          ARCHIVE="${ASSET}.zip"
          test -s "bin/${ASSET}.exe"
          (cd bin && mv "${ASSET}.exe" "shellsentry.exe")
          "$py" -c 'import zipfile,sys; z=zipfile.ZipFile(sys.argv[1],"w",zipfile.ZIP_DEFLATED); z.write("bin/shellsentry.exe","shellsentry.exe")' "${ARCHIVE}"
          (cd bin && mv "shellsentry.exe" "${ASSET}.exe")
          test -s "${ARCHIVE}"
          echo "packed ${ARCHIVE}"
