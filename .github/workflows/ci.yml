---
name: CI

'on':
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}
  SFETCH_GITHUB_TOKEN: ${{ github.token }}
  # Keep in sync with Makefile SFETCH_ACTION_SHA / SFETCH_VERSION (coupled pins).
  SFETCH_ACTION_SHA: 0c2e7490420100b5d35a9e01f96f4aea8679663e
  SFETCH_VERSION: v0.4.11
  GONEAT_VERSION: v0.5.15

jobs:
  test:
    name: Linux quality (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Install system tools
        run: |
          sudo apt-get update && \
            sudo apt-get install -y --no-install-recommends \
            yamllint shellcheck

      - name: Setup sfetch (verified action)
        uses: 3leaps/sfetch/.github/actions/setup-sfetch@0c2e7490420100b5d35a9e01f96f4aea8679663e
        with:
          sfetch-version: v0.4.11
          install-dir: ${{ github.workspace }}/bin

      - name: Install goneat via sfetch (pinned)
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          sfetch --repo fulmenhq/goneat \
            --tag "${GONEAT_VERSION}" \
            --dest-dir bin \
            --require-minisign
          goneat version 2>&1 | head -n1

      - name: Assert no pipe-to-bash install-sfetch
        run: make assert-no-pipe-install-sfetch

      - name: sfetch pin freshness (informational soft-warn only)
        run: make check-sfetch-pin-freshness
        continue-on-error: true

      - name: Quality
        run: |
          export PATH="$PWD/bin:$PATH"
          make prepush

      - name: Dogfood install-sfetch.sh with shellsentry
        run: |
          export PATH="$PWD/bin:$PATH"
          make dogfood

  test-linux-arm64:
    name: Linux quality (arm64)
    runs-on: ubuntu-latest-arm64-s
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Install system tools
        run: |
          sudo apt-get update && \
            sudo apt-get install -y --no-install-recommends \
            yamllint shellcheck

      - name: Setup sfetch (verified action)
        uses: 3leaps/sfetch/.github/actions/setup-sfetch@0c2e7490420100b5d35a9e01f96f4aea8679663e
        with:
          sfetch-version: v0.4.11
          install-dir: ${{ github.workspace }}/bin

      - name: Install goneat via sfetch (pinned)
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          sfetch --repo fulmenhq/goneat \
            --tag "${GONEAT_VERSION}" \
            --dest-dir bin \
            --require-minisign
          goneat version 2>&1 | head -n1

      - name: Test and build
        run: |
          export PATH="$PWD/bin:$PATH"
          make test build

  macos-bootstrap-smoke:
    name: macOS bootstrap smoke (Makefile path)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Verified make bootstrap (engine digest path)
        run: |
          set -euo pipefail
          make bootstrap
          bin/sfetch --version 2>&1 | tee /tmp/sf.txt
          grep -E '0\.4\.11' /tmp/sf.txt
          bin/goneat version 2>&1 | head -n1

  windows-dogfood-x64:
    name: Windows dogfood (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      # No choco/winget minisign — setup-sfetch acquires pinned minisign 0.12.
      - name: Setup sfetch (verified action)
        uses: 3leaps/sfetch/.github/actions/setup-sfetch@0c2e7490420100b5d35a9e01f96f4aea8679663e
        with:
          sfetch-version: v0.4.11
          install-dir: ${{ github.workspace }}/bin

      - name: Install goneat via sfetch
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          SFETCH_BIN=sfetch
          if [ -x ./bin/sfetch.exe ]; then SFETCH_BIN=./bin/sfetch.exe; fi
          if [ -x ./bin/sfetch ]; then SFETCH_BIN=./bin/sfetch; fi
          "$SFETCH_BIN" --repo fulmenhq/goneat \
            --tag "${GONEAT_VERSION}" \
            --dest-dir bin \
            --require-minisign
          if [ -x ./bin/goneat.exe ]; then ./bin/goneat.exe version; else goneat version; fi

      - name: Test and build
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          go test ./...
          make build

  windows-dogfood-arm64:
    name: Windows dogfood (arm64)
    runs-on: windows-latest-arm64-s
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Setup sfetch (verified action)
        uses: 3leaps/sfetch/.github/actions/setup-sfetch@0c2e7490420100b5d35a9e01f96f4aea8679663e
        with:
          sfetch-version: v0.4.11
          install-dir: ${{ github.workspace }}/bin

      - name: Verify install script detects windows arm64
        shell: bash
        run: |
          set -euo pipefail
          lib="$(mktemp)"
          sed '$d' scripts/install-shellsentry.sh > "$lib"
          printf '\ndetect_platform\n' >> "$lib"
          platform="$(bash "$lib" | tr -d '\r\n')"
          echo "Detected platform via install-shellsentry.sh: $platform"
          test "$platform" = "windows_arm64"

      - name: Install goneat via sfetch
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/bin:$PATH"
          SFETCH_BIN=sfetch
          if [ -x ./bin/sfetch.exe ]; then SFETCH_BIN=./bin/sfetch.exe; fi
          if [ -x ./bin/sfetch ]; then SFETCH_BIN=./bin/sfetch; fi
          "$SFETCH_BIN" --repo fulmenhq/goneat \
            --tag "${GONEAT_VERSION}" \
            --dest-dir bin \
            --require-minisign
          if [ -x ./bin/goneat.exe ]; then ./bin/goneat.exe version; else goneat version; fi

      - name: Test and build
        shell: bash
        run: |
          export PATH="$PWD/bin:$PATH"
          go test ./...
          make build
