---
# Tag workflow is defined by the tagged commit: read-only, artifacts only.
# It never creates a GitHub Release and never signs. A green run is a
# consistency signal, not release authorization.
name: Release

'on':
  push:
    tags:
      - "v*"

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NAME: shellsentry

jobs:
  verify-anchors:
    name: Verify committed anchors
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - name: Validate VERSION matches tag
        run: |
          set -euo pipefail
          FILE_VERSION=$(cat VERSION)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION file: $FILE_VERSION"
          echo "Git tag: $TAG_VERSION"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Install pinned Decernor
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/decernor-ci"
          mkdir -p "$tool_dir"
          SHELLSENTRY_DECERNOR_BIN="$(./scripts/ci-install-decernor.sh "$tool_dir")"
          case "$SHELLSENTRY_DECERNOR_BIN" in
            *$'\n'*) echo "error: Decernor install printed extra stdout" >&2; exit 1 ;;
          esac
          echo "SHELLSENTRY_DECERNOR_BIN=$SHELLSENTRY_DECERNOR_BIN" >>"$GITHUB_ENV"
          echo "Installed Decernor at $SHELLSENTRY_DECERNOR_BIN"

      - name: Verify committed public anchors
        run: |
          set -euo pipefail
          test -x "${SHELLSENTRY_DECERNOR_BIN:?SHELLSENTRY_DECERNOR_BIN required}"
          ./scripts/release-verify-committed-anchors.sh

  build:
    needs: verify-anchors
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm64-s
            goos: linux
            goarch: arm64
          - runner: macos-15
            goos: darwin
            goarch: arm64
          - runner: windows-2022
            goos: windows
            goarch: amd64
          - runner: windows-11-arm64-s
            goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - name: Validate VERSION matches tag
        run: |
          set -euo pipefail
          FILE_VERSION=$(cat VERSION)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION file: $FILE_VERSION"
          echo "Git tag: $TAG_VERSION"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.26.10'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Assert native host
        run: |
          set -euo pipefail
          host="$(go env GOHOSTOS)/$(go env GOHOSTARCH)"
          want="${{ matrix.goos }}/${{ matrix.goarch }}"
          echo "runner host $host matches $want"
          test "$host" = "$want"

      - name: License check
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        # Pin go-licenses; do not use @latest on the release path.
        run: |
          go install github.com/google/go-licenses@v1.5.0
          REPORT=$(go-licenses csv ./...)
          echo "$REPORT"
          if echo "$REPORT" | grep -E "(GPL|AGPL)" >/dev/null 2>&1; then
            echo "GPL/AGPL detected—blocked"
            exit 1
          fi

      - name: Build
        run: make build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0

      - name: Package artifact
        run: |
          set -euo pipefail
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ./scripts/package-windows-zip.sh "${{ matrix.goos }}" "${{ matrix.goarch }}"
          else
            ASSET="shellsentry_${{ matrix.goos }}_${{ matrix.goarch }}"
            ARCHIVE="${ASSET}.tar.gz"
            (cd bin && mv "${ASSET}" shellsentry)
            tar czf "${ARCHIVE}" -C bin shellsentry
            (cd bin && mv shellsentry "${ASSET}")
            echo "ASSET_FILE=${ARCHIVE}" >> "$GITHUB_ENV"
          fi

      - name: Upload packaged archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: shellsentry_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ env.ASSET_FILE }}
          if-no-files-found: error
          retention-days: 30

  collect-packages:
    name: Collect release packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          pattern: shellsentry_*
          path: dist/release
          merge-multiple: true

      - name: Upload combined release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-packages-${{ github.ref_name }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
