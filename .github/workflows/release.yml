---
name: Release

'on':
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NAME: shellsentry

jobs:
  create_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # softprops/action-gh-release@v3 (Node 24) replaces the archived,
      # Node12-era actions/create-release@v1 + actions/upload-release-asset@v1.
      # It creates a draft for the pushed tag (idempotent) and uploads the
      # install script. The build matrix below appends per-platform archives.
      # Maintainer signs + publishes afterward via scripts/ (see RELEASE_CHECKLIST.md).
      # Every release-writing action must set draft: true so CI cannot publish.
      - name: Create draft release and upload install script
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: shellsentry ${{ github.ref_name }}
          body: |
            ## shellsentry ${{ github.ref_name }}
            Draft release — incomplete until the maintainer signs and publishes.
          draft: true
          prerelease: false
          files: scripts/install-shellsentry.sh

  build:
    needs: create_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v5

      - name: Validate VERSION matches tag
        run: |
          FILE_VERSION=$(cat VERSION)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION file: $FILE_VERSION"
          echo "Git tag: $TAG_VERSION"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            MSG="VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"
            echo "::error::$MSG"
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'

      - name: License check
        # Pin go-licenses; do not use @latest on the release path.
        run: |
          go install github.com/google/go-licenses@v1.5.0
          REPORT=$(go-licenses csv ./...)
          echo "$REPORT"
          if echo "$REPORT" | grep -E "(GPL|AGPL)" >/dev/null 2>&1; then
            echo "GPL/AGPL detected—blocked"
            exit 1
          fi

      - name: Install release dependencies
        run: sudo apt-get update && sudo apt-get install -y zip gnupg

      - name: Build
        run: make build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          ASSET="shellsentry_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ARCHIVE="${ASSET}.zip"
            (cd bin && mv "${ASSET}.exe" "shellsentry.exe")
            zip -j "${ARCHIVE}" "bin/shellsentry.exe"
            (cd bin && mv "shellsentry.exe" "${ASSET}.exe")
            CONTENT_TYPE="application/zip"
          else
            ARCHIVE="${ASSET}.tar.gz"
            (cd bin && mv "${ASSET}" shellsentry)
            tar czf "${ARCHIVE}" -C bin shellsentry
            (cd bin && mv shellsentry "${ASSET}")
            CONTENT_TYPE="application/gzip"
          fi
          echo "ASSET_FILE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "ASSET_CONTENT_TYPE=${CONTENT_TYPE}" >> "$GITHUB_ENV"

      # Reopens the same release as a draft while appending this matrix entry's
      # archive. Every release-writing action must state draft: true so parallel
      # uploads cannot publish before signing.
      - name: Upload Archive
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          draft: true
          files: ${{ env.ASSET_FILE }}

      - name: Signing handled manually
        # NOTE: actionlint rejects constant expressions like `${{ false }}`.
        # Keep this step effectively disabled while leaving a breadcrumb.
        if: ${{ github.ref == 'refs/tags/__disabled__' }}
        run: echo "Signing occurs via scripts/sign-release-assets.sh after CI"
