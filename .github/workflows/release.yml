---
name: Release

'on':
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NAME: shellsentry

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v5

      - name: Validate VERSION matches tag
        run: |
          FILE_VERSION=$(cat VERSION)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION file: $FILE_VERSION"
          echo "Git tag: $TAG_VERSION"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            MSG="VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"
            echo "::error::$MSG"
            exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'

      - name: License check
        # Pin go-licenses; do not use @latest on the release path.
        run: |
          go install github.com/google/go-licenses@v1.5.0
          REPORT=$(go-licenses csv ./...)
          echo "$REPORT"
          if echo "$REPORT" | grep -E "(GPL|AGPL)" >/dev/null 2>&1; then
            echo "GPL/AGPL detected—blocked"
            exit 1
          fi

      - name: Install release dependencies
        run: sudo apt-get update && sudo apt-get install -y zip gnupg

      - name: Build
        run: make build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          ASSET="shellsentry_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ARCHIVE="${ASSET}.zip"
            (cd bin && mv "${ASSET}.exe" "shellsentry.exe")
            zip -j "${ARCHIVE}" "bin/shellsentry.exe"
            (cd bin && mv "shellsentry.exe" "${ASSET}.exe")
          else
            ARCHIVE="${ASSET}.tar.gz"
            (cd bin && mv "${ASSET}" shellsentry)
            tar czf "${ARCHIVE}" -C bin shellsentry
            (cd bin && mv shellsentry "${ASSET}")
          fi
          echo "ASSET_FILE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload packaged archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: shellsentry_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ env.ASSET_FILE }}
          if-no-files-found: error
          retention-days: 30

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download packed archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          path: dist/release
          merge-multiple: true

      - name: Copy install script
        run: |
          mkdir -p dist/release
          cp scripts/install-shellsentry.sh dist/release/install-shellsentry.sh

      # Every release-writing action must set draft: true so CI cannot publish.
      # Maintainer signs and publishes afterward (see RELEASE_CHECKLIST.md).
      - name: Attach archives to draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: shellsentry ${{ github.ref_name }}
          body: |
            ## shellsentry ${{ github.ref_name }}
            Draft release — incomplete until the maintainer signs and publishes.
          draft: true
          prerelease: false
          files: dist/release/*
